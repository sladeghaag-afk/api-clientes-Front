<h4>CADASTRO DE CLIENTES</h4>
<p>Preencha os campos abaixo para cadastrar um novo cliente:</p>
<hr>

<form [formGroup]="formCadastro"(ngSubmit)="cadastrarCliente()">
  <div class = "mb-3">
         <label>Nome do cliente:</label>
         <input type = "text" class = "form-control" placeholder =
         "Digite o nome do cliente"
         formControlName = "nome"/>

  </div>
 <div class = "mb-3">
          <label>CPF:</label>
          <input type ="text" class = "form-control" placeholder ="Digite o CPF do cliente"
          formControlName = "cpf"/>
 </div>
 <div class = "mb-3">
          <label>Email:</label>
          <input type ="text" class = "form-control" placeholder ="Digite o email do cliente"
          formControlName = "email"/>
</div>

<div class = "mb-3">

    <input type = "submit" class = "btn btn-success shadow" value = "Realizar cadastro"/>

</div>


</form>
